
name: ShopSphere Microservices CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/${{ matrix.service }}/requirements.txt
          pip install pytest httpx

      - name: Run Python Tests
        run: |
          if [ -d "app/${{ matrix.service }}/tests" ]; then
            python -m pytest "app/${{ matrix.service }}/tests" -v
          else
            echo "No tests found for ${{ matrix.service }}"
          fi

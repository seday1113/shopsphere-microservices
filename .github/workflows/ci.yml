
name: ShopSphere Microservices CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/${{ matrix.service }}/requirements.txt
          pip install pytest httpx

      - name: Run Python Tests
        run: |
          if [ -d "app/${{ matrix.service }}/tests" ]; then
            python -m pytest "app/${{ matrix.service }}/tests" -v
          else
            echo "No tests found for ${{ matrix.service }}"
          fi

  security-scans:
    name: Trivy and Checkov Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Terraform Scan
        run: checkov -d terraform --framework terraform --soft-fail

  docker-build:
    name: Docker Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: python-tests

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - payment-service
          - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/${{ matrix.service }}
          push: false
          tags: shopsphere/${{ matrix.service }}:ci

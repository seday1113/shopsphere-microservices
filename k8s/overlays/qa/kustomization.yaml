apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopsphere-qa

resources:
  - ../../base/frontend
  - ../../base/product-service
  - ../../base/order-service
  - ../../base/user-service
  - ../../base/payment-service

replicas:
  - name: product-service
    count: 1
  - name: order-service
    count: 1
  - name: user-service
    count: 1
  - name: payment-service
    count: 1
